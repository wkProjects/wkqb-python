[project]
name = "wkqb"
version = "6.0.0.dev0"
description = "wkQB, the Webkicks Quote Bot"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14,<4",
    "croniter>=7,<8",
    "tzdata>=2025.1",
]

[project.scripts]
wkqb = "wkqb.__main__:main"
wkqb-tracer = "wkqb.tracer:main"

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9.2",
    "pytest-asyncio>=1.5",
    "ruff>=0.17",
    "types-croniter>=6.2.4.20261122",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# the tests poll the fake server's state
"tests/**" = ["ASYNC110"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "tests"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# the test helpers (fake_webkicks) are imported from tests/
addopts = ["--import-mode=importlib"]
pythonpath = ["tests"]
