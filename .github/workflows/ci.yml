name: CI

on:
  push:
  pull_request:

# No token permissions by default; jobs ask for what they need
permissions: {}

# A newer push to the same branch/PR cancels the running check
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type check, tests
    runs-on: ubuntu-latest
    permissions:
      contents: read   # checkout
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest

  image:
    name: Docker image
    # every bot pod pulls its image on start: only tested code may become one
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read   # checkout
      packages: write  # push to GHCR
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/wkProjects/wkqb
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        # pull requests only build the image; pushes publish it
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
